    </div>
    <h2 class="nama-tulis" data-reveal data-k="$.pasangan"></h2>
    <div class="baris-tgl" data-reveal><span data-k="tanggalUtama|hari"></span><i></i><b data-k="tanggalUtama|tgl1"></b><i></i><span><span data-k="tanggalUtama|bulan"></span> <span data-k="tanggalUtama|tahun"></span></span></div>
  </section>

  <!-- Kutipan -->
  <section class="bagian">
    <svg class="mawar pemisah" viewBox="0 0 100 130" data-reveal aria-hidden="true"><path pathLength="1" d="M50 40 c-6 0 -8 -8 -2 -10 c8 -3 14 6 8 12 c-8 8 -22 2 -22 -10 c0 -14 18 -20 28 -12 c10 8 6 26 -8 30 c-14 4 -28 -6 -28 -20"/><path pathLength="1" style="--pd:.5s" d="M22 30 c-4 10 0 22 10 28 M70 30 c6 10 4 24 -6 30"/><path pathLength="1" style="--pd:.9s" d="M48 62 C46 80 50 100 46 128"/><path pathLength="1" style="--pd:1.3s" d="M47 86 c-10 -6 -20 -4 -24 4 c8 4 18 4 24 -4"/><path pathLength="1" style="--pd:1.5s" d="M48 104 c8 -8 18 -8 24 -2 c-8 6 -18 8 -24 2"/></svg>
    <p class="kutipan" data-reveal data-k="pembuka.kutipan"></p>
    <p class="kecil" data-reveal data-k="pembuka.sumber" style="margin-top:14px"></p>
  </section>

  <!-- Mempelai -->
  <section class="bagian mempelai" id="mempelai">
    <hr class="garis-h" style="margin-bottom:56px">
    <p class="kecil" data-reveal>Mempelai</p>
    <p class="teks" data-reveal data-k="pembuka.teks" style="margin-bottom:34px"></p>
    <article class="orang" data-reveal="up">
      <div class="foto" data-src="$.a.foto" data-ph="Foto" data-zoom></div>
      <h3 data-k="$.a.panggilan"></h3>
      <div class="nl" data-k="$.a.nama"></div>
      <p><span data-k="$.a.keterangan"></span> <span data-k="$.a.ayah"></span> &amp; <span data-k="$.a.ibu"></span></p>
      <a data-href="$.a.instagram|igurl" data-k="$.a.instagram|ig"></a>
    </article>
    <svg class="mawar pemisah" viewBox="0 0 100 130" data-reveal aria-hidden="true"><path pathLength="1" d="M50 40 c-6 0 -8 -8 -2 -10 c8 -3 14 6 8 12 c-8 8 -22 2 -22 -10 c0 -14 18 -20 28 -12 c10 8 6 26 -8 30 c-14 4 -28 -6 -28 -20"/><path pathLength="1" style="--pd:.5s" d="M22 30 c-4 10 0 22 10 28 M70 30 c6 10 4 24 -6 30"/><path pathLength="1" style="--pd:.9s" d="M48 62 C46 80 50 100 46 128"/><path pathLength="1" style="--pd:1.3s" d="M47 86 c-10 -6 -20 -4 -24 4 c8 4 18 4 24 -4"/><path pathLength="1" style="--pd:1.5s" d="M48 104 c8 -8 18 -8 24 -2 c-8 6 -18 8 -24 2"/></svg>
    <article class="orang" data-reveal="up">
      <div class="foto" data-src="$.b.foto" data-ph="Foto" data-zoom></div>
      <h3 data-k="$.b.panggilan"></h3>
      <div class="nl" data-k="$.b.nama"></div>
      <p><span data-k="$.b.keterangan"></span> <span data-k="$.b.ayah"></span> &amp; <span data-k="$.b.ibu"></span></p>
      <a data-href="$.b.instagram|igurl" data-k="$.b.instagram|ig"></a>
    </article>
  </section>

  <!-- Hitung mundur -->
  <section class="bagian">
    <p class="kecil" data-reveal>Menuju hari bahagia</p>
    <div class="hitung" data-countdown data-reveal>
      <div><b data-cd="d">00</b><span>Hari</span></div>
      <div><b data-cd="h">00</b><span>Jam</span></div>
      <div><b data-cd="m">00</b><span>Menit</span></div>
      <div><b data-cd="s">00</b><span>Detik</span></div>
    </div>
  </section>

  <!-- Acara -->
  <section class="bagian" id="acara">
    <p class="kecil" data-reveal>Waktu &amp; tempat</p>
    <h2 class="judul" data-reveal data-k="tanggalUtama|panjang"></h2>
    <div class="acara-list" data-each="acara">
      <template>
        <article class="acara" data-reveal="up">
          <h3 data-k=".nama"></h3>
          <div class="waktu">
            <div><small>Mulai</small><b data-k=".mulai"></b></div>
            <i></i>
            <div><small>Selesai</small><b><span data-k=".selesai" data-keep>Selesai</span></b></div>
          </div>
          <p class="alamat" data-k=".zona" style="margin-top:8px"></p>
          <p class="tempat" data-k=".tempat"></p>
          <p class="alamat" data-k=".alamat"></p>
          <div class="aksi"><a class="btn penuh" data-href=".peta">Lihat lokasi</a><a class="btn" data-gcal>Simpan tanggal</a></div>
        </article>
      </template>
    </div>
  </section>

  <!-- Kisah -->
  <section class="bagian" id="kisah" data-if="kisah">
    <svg class="mawar pemisah" viewBox="0 0 100 130" data-reveal aria-hidden="true"><path pathLength="1" d="M50 40 c-6 0 -8 -8 -2 -10 c8 -3 14 6 8 12 c-8 8 -22 2 -22 -10 c0 -14 18 -20 28 -12 c10 8 6 26 -8 30 c-14 4 -28 -6 -28 -20"/><path pathLength="1" style="--pd:.5s" d="M22 30 c-4 10 0 22 10 28 M70 30 c6 10 4 24 -6 30"/><path pathLength="1" style="--pd:.9s" d="M48 62 C46 80 50 100 46 128"/><path pathLength="1" style="--pd:1.3s" d="M47 86 c-10 -6 -20 -4 -24 4 c8 4 18 4 24 -4"/><path pathLength="1" style="--pd:1.5s" d="M48 104 c8 -8 18 -8 24 -2 c-8 6 -18 8 -24 2"/></svg>
    <p class="kecil" data-reveal style="margin-top:18px">Kisah kami</p>
    <div class="kisah-list" data-each="kisah">
      <template><article class="kisah" data-reveal="up"><small data-k=".tahun"></small><div><h4 data-k=".judul"></h4><p data-k=".cerita"></p></div></article></template>
    </div>
  </section>

  <!-- Galeri -->
  <section class="bagian" id="galeri" data-if="galeri">
    <p class="kecil" data-reveal>Galeri</p>
    <h2 class="judul" data-reveal>Potret kami</h2>
    <div class="galeri" data-each="galeri">
      <template><div class="foto" data-src=".src" data-attr="data-ph=$n;data-caption=.ket" data-zoom data-reveal="up" style="--d:calc(var(--i) * 70ms)"></div></template>
    </div>
    <div class="video-bingkai" data-if="video" data-video></div>
  </section>

  <!-- RSVP -->
  <section class="bagian" id="rsvp" data-if="rsvp">
    <hr class="garis-h" style="margin-bottom:56px">
    <p class="kecil" data-reveal>RSVP</p>
    <h2 class="judul" data-reveal>Konfirmasi kehadiran</h2>
    <form class="form" data-rsvp data-reveal>
      <label for="r-nama">Nama<input id="r-nama" name="nama" type="text" autocomplete="name" maxlength="60" placeholder="Nama Anda"></label>
      <div class="lbl">Kehadiran
        <div class="pilih">
          <label><input type="radio" name="hadir" value="ya" id="r-ya"><span>Hadir</span></label>
          <label><input type="radio" name="hadir" value="tidak" id="r-tidak"><span>Berhalangan</span></label>
          <label><input type="radio" name="hadir" value="ragu" id="r-ragu"><span>Belum pasti</span></label>
        </div>
      </div>
      <label for="r-jumlah">Jumlah tamu<select id="r-jumlah" name="jumlah"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <label for="r-ucapan">Ucapan &amp; doa<textarea id="r-ucapan" name="ucapan" maxlength="500" placeholder="Tulis doa untuk kedua mempelai"></textarea></label>
      <button class="btn penuh" type="submit">Kirim</button>
    </form>
    <div class="statistik"><div><b data-rsvp-total>0</b>Ucapan</div><div><b data-rsvp-hadir>0</b>Hadir</div><div><b data-rsvp-tidak>0</b>Absen</div></div>
    <div class="ucapan-list" data-wishes>
      <template><article class="uc"><h4><span data-k=".nama"></span><em data-k=".hadirLabel"></em><small data-if=".contoh">contoh</small></h4><p data-k=".ucapan"></p><time data-k=".waktuLabel"></time></article></template>
    </div>
  </section>

  <!-- Hadiah -->
  <section class="bagian" id="hadiah" data-if="hadiah">
    <p class="kecil" data-reveal style="margin-top:56px">Tanda kasih</p>
    <p class="teks" data-reveal data-k="hadiah.teks"></p>
    <div class="rek-list" data-each="hadiah.rekening">
      <template>
        <div class="rek" data-reveal="up" style="--d:calc(var(--i) * 110ms)">
          <div style="min-width:0"><div class="bank" data-k=".bank"></div><div class="no" data-k=".nomor|angka"></div><div class="an" data-k=".atasNama"></div></div>
          <button class="btn" type="button" data-copy=".nomor" data-copy-msg="Nomor rekening disalin">Salin</button>
        </div>
      </template>
    </div>
    <div class="kado" data-if="hadiah.alamat" data-reveal>Kirim kado ke<b data-k="hadiah.alamat.penerima"></b><span data-k="hadiah.alamat.alamat"></span>
      <div class="aksi"><button class="btn" type="button" data-copy="hadiah.alamat.alamat" data-copy-msg="Alamat disalin">Salin alamat</button></div>
    </div>
  </section>

  <!-- Penutup -->
  <section class="bagian penutup">
    <hr class="garis-h" style="margin-bottom:56px">
    <svg class="mawar" viewBox="0 0 100 130" data-reveal aria-hidden="true"><path pathLength="1" d="M50 40 c-6 0 -8 -8 -2 -10 c8 -3 14 6 8 12 c-8 8 -22 2 -22 -10 c0 -14 18 -20 28 -12 c10 8 6 26 -8 30 c-14 4 -28 -6 -28 -20"/><path pathLength="1" style="--pd:.5s" d="M22 30 c-4 10 0 22 10 28 M70 30 c6 10 4 24 -6 30"/><path pathLength="1" style="--pd:.9s" d="M48 62 C46 80 50 100 46 128"/><path pathLength="1" style="--pd:1.3s" d="M47 86 c-10 -6 -20 -4 -24 4 c8 4 18 4 24 -4"/><path pathLength="1" style="--pd:1.5s" d="M48 104 c8 -8 18 -8 24 -2 c-8 6 -18 8 -24 2"/></svg>
    <p class="teks" data-reveal data-k="penutup.teks"></p>
    <p class="kecil" data-reveal data-k="penutup.salam" style="margin-top:30px"></p>
    <h2 class="nama-tulis" data-reveal data-k="$.pasangan"></h2>
    <p class="teks" data-reveal data-k="penutup.keluarga" style="font-size:12.5px"></p>
  </section>
  <div class="kredit" data-k="kredit"></div>
</main>

<button class="musik" type="button" data-musik aria-pressed="false" aria-label="Putar musik">
  <svg class="mawar" viewBox="0 0 100 130" aria-hidden="true" style="stroke-width:3"><path d="M50 40 c-6 0 -8 -8 -2 -10 c8 -3 14 6 8 12 c-8 8 -22 2 -22 -10 c0 -14 18 -20 28 -12 c10 8 6 26 -8 30 c-14 4 -28 -6 -28 -20"/><path d="M48 62 C46 80 50 100 46 128"/><path d="M47 86 c-10 -6 -20 -4 -24 4 c8 4 18 4 24 -4"/></svg>
</button>
